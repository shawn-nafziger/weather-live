name: Daily official records

# Twice a day: 11:37 and 17:37 UTC (morning and early afternoon in the US).
# Stations post yesterday's official values in the morning and sometimes
# correct them later; each run re-reads the last 21 days. Also runnable by hand.
on:
  schedule:
    - cron: "37 11 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs write at the same time.
concurrency:
  group: daily-records
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update official daily records
        run: python scripts/station_update.py

      - name: Save the new data
        run: |
          git config user.name "weather-live bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -q -m "Records: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed three times." && exit 1
