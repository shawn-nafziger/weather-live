name: Daily official records

# Four times a day, 11:37 to 17:37 UTC (US morning to early afternoon).
# Stations post yesterday's official values in the morning and sometimes
# correct them later; each run re-reads the last 21 days. Several slots because
# GitHub sometimes skips scheduled runs. Also runnable by hand.
on:
  schedule:
    - cron: "37 11,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs write at the same time.
concurrency:
  group: daily-records
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update official daily records
        run: python scripts/station_update.py

      - name: Save the new data
        run: |
          git config user.name "weather-live bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -q -m "Records: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed three times." && exit 1

  # Rebuild the Almanac pages from the records just saved and publish them to
  # weather.tallorderdigital.com (GitHub Pages). A separate job, so a website
  # problem shows up on its own and never stops the records from being saved.
  almanac:
    needs: pull
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # the records the job above just pushed

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: almanac/requirements.txt

      - run: pip install -r almanac/requirements.txt

      - name: Build the Almanac pages
        run: python almanac/build.py --all --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
