name: Daily official records

# Four times a day, 11:37 to 17:37 UTC (US morning to early afternoon).
# Stations post yesterday's official values in the morning and sometimes
# correct them later; each run re-reads the last 21 days. Several slots because
# GitHub sometimes skips scheduled runs. Also runnable by hand.
on:
  schedule:
    - cron: "37 11,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs write at the same time.
concurrency:
  group: daily-records
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update official daily records
        run: python scripts/station_update.py

      # Runs even if the update step failed (for example, NOAA's server was down for
      # every city), so history/status.json still records what went wrong.
      - name: Save the new data
        if: always()
        run: |
          git config user.name "weather-live bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -q -m "Records: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed three times." && exit 1

  # Rebuild the Almanac pages from the records just saved and hand them to the
  # main site (Nov 10, 2026): they're pushed to the almanac-build branch (one
  # commit, replaced each run, so the repo doesn't grow), then tallorderdigital-site
  # is asked to republish. Its workflow copies the branch into weather/almanac/,
  # so the Almanac is part of tallorderdigital.com itself. A separate job, so a
  # website problem shows up on its own and never stops the records from being saved.
  almanac:
    needs: pull
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write        # to replace the almanac-build branch
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # the records the job above just pushed

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: almanac/requirements.txt

      - run: pip install -r almanac/requirements.txt

      - name: Build the Almanac pages
        run: python almanac/build.py --all --out site

      - name: Keep last good pages for places that didn't pass today
        run: |
          git clone -q --depth 1 --branch almanac-build "https://github.com/${GITHUB_REPOSITORY}.git" prev \
            || echo "No earlier build yet."
          python almanac/carry_over.py site/almanac prev

      - name: Replace the almanac-build branch with this build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f site/almanac/index.html && test -f site/almanac/sitemap.xml
          cd site/almanac
          git init -q -b almanac-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Almanac build $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" almanac-build

      - name: Ask tallorderdigital.com to republish
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DEPLOY_TOKEN isn't set, so the main site wasn't asked to republish (see README)."
            exit 0
          fi
          gh api repos/shawn-nafziger/tallorderdigital-site/dispatches -f event_type=almanac-updated
