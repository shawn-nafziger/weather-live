name: Tests

# Runs the offline tests on every pull request, on the same Python the daily and
# hourly jobs use. A green check on the PR means the code works on GitHub's
# runner, not just in Claude's workspace (which has a newer Python: a
# 3.13-only call broke the Nov 3, 2026 records runs).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            almanac/requirements.txt

      - run: pip install -r requirements.txt -r almanac/requirements.txt

      - name: Offline tests
        run: python -m unittest discover tests -v
