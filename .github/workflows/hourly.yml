name: Hourly weather pull

# Asks every 15 minutes (:07, :22, :37, :52). GitHub starts scheduled runs late
# or skips them when busy (on Oct 29-30 only 2 of ~11 hourly runs happened), so
# asking more often keeps at least one run an hour. Extra runs are harmless:
# forecasts and readings are saved once each. Also runnable by hand.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs write at the same time.
concurrency:
  group: hourly-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull forecasts and observations
        run: python scripts/nws_pull.py

      - name: Save the new data
        run: |
          git config user.name "weather-live bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive live
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -q -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed three times." && exit 1
